apiVersion: v1
kind: ConfigMap
metadata:
  name: my-service-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  my-service.json: |
    {
      "uid": "my-service",
      "title": "My Service",
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Версия модели в подах",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"textMode": "value_and_name", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "count by (version) (my_service_model_info)", "legendFormat": "{{version}}", "instant": true}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Запросов к /v1/predict за 5 минут",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum(increase(http_requests_total{handler=\"/v1/predict\"}[5m]))"}]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Запросы в секунду",
          "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [{"refId": "A", "expr": "sum by (handler, status) (rate(http_requests_total{handler!=\"/metrics\"}[1m]))", "legendFormat": "{{handler}} {{status}}"}]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Задержка /v1/predict",
          "gridPos": {"x": 12, "y": 5, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Доля положительного класса",
          "gridPos": {"x": 0, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"refId": "A", "expr": "sum(rate(my_service_predictions_total{prediction=\"1\"}[5m])) / sum(rate(my_service_predictions_total[5m]))", "legendFormat": "prediction=1"}]
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Распределение score за 15 минут",
          "gridPos": {"x": 12, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"orientation": "vertical", "displayMode": "basic", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum by (le) (increase(my_service_score_bucket[15m]))", "legendFormat": "{{le}}"}]
        }
      ]
    }
