apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app: my_service
  template:
    metadata:
      labels:
        app: my_service
    spec:
      containers:
        - name: api
          image: my_service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: my-service-config}
            - secretRef: {name: my-service-secrets}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            timeoutSeconds: 5
            failureThreshold: 60
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            timeoutSeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
